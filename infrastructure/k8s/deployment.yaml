apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-platform-api
  labels:
    app: eval-platform
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: eval-platform
      component: api
  template:
    metadata:
      labels:
        app: eval-platform
        component: api
    spec:
      containers:
        - name: api
          image: eval-platform:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          env:
            - name: APP_ENVIRONMENT
              value: production
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: eval-platform-config
                  key: kafka_servers
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eval-platform-secrets
                  key: db_password
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-platform-consumer
  labels:
    app: eval-platform
    component: consumer
spec:
  replicas: 4
  selector:
    matchLabels:
      app: eval-platform
      component: consumer
  template:
    metadata:
      labels:
        app: eval-platform
        component: consumer
    spec:
      containers:
        - name: consumer
          image: eval-platform:latest
          command: ["python", "-m", "src.pipeline.consumer"]
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4000m"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          env:
            - name: APP_ENVIRONMENT
              value: production
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eval-platform-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eval-platform-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: eval-platform-api
spec:
  selector:
    app: eval-platform
    component: api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
