# Alerting rules for the ML Evaluation Platform

groups:
  - name: evaluation_platform
    rules:
      # High latency alert
      - alert: HighEvaluationLatency
        expr: histogram_quantile(0.99, evaluation_latency_seconds) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 evaluation latency exceeds 500ms"
          description: "The 99th percentile evaluation latency is {{ $value }}s"

      # Error rate alert
      - alert: HighErrorRate
        expr: rate(evaluations_total{status="error"}[5m]) / rate(evaluations_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Evaluation error rate exceeds 5%"

      # Review queue buildup
      - alert: ReviewQueueBacklog
        expr: review_queue_size > 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Human review queue has {{ $value }} pending items"

      # Model drift detected
      - alert: ModelDriftDetected
        expr: model_prediction_drift > 0.15
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Prediction drift detected (KL={{ $value }})"
          description: "Consider triggering model retraining"

      # False acceptance rate
      - alert: HighFalseAcceptance
        expr: false_acceptance_rate > 0.02
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "False acceptance rate is {{ $value }}, exceeds 2% threshold"

      # LLM provider errors
      - alert: LLMProviderErrors
        expr: rate(tier3_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM provider error rate elevated"
